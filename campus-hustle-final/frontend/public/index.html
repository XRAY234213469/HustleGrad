<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0288d1" />
    <meta name="description" content="HustleGrad — The peer-to-peer marketplace for Strathmore University students." />
    <meta property="og:title" content="HustleGrad" />
    <meta property="og:description" content="Buy, sell, and book campus services — all in one place." />
    <title>HustleGrad</title>

    <!-- Favicon inline so there's no 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

    <style>
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, sans-serif;
        background: #f8fafc;
      }
      #root { min-height: 100vh; }
      

      /* Page loader */
      #page-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #0f172a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #page-loader.hidden { opacity: 0; visibility: hidden; }
      #page-loader .logo {
        font-size: 2.5rem; font-weight: 800;
        color: #fff; letter-spacing: -0.03em;
      }
      #page-loader .logo span { color: #0288d1; }
      #page-loader .bar-track {
        width: 180px; height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 99px; overflow: hidden;
      }
      #page-loader .bar-fill {
        height: 100%; width: 0%;
        background: #0288d1; border-radius: 99px;
        animation: load-bar 1s ease forwards;
      }
      @keyframes load-bar { to { width: 100%; } }

      .reveal {
        opacity: 0; transform: translateY(28px);
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      .reveal.visible { opacity: 1; transform: translateY(0); }

      html { scroll-behavior: smooth; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="page-loader">
      <div class="logo">Hustle<span>Grad</span></div>
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('page-loader');
          if (loader) loader.classList.add('hidden');
        }, 900);
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.12 });

      const mutationObs = new MutationObserver(() => {
        document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));
      });
      mutationObs.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
